# Arquivo: .github/workflows/verificacoes.yml
# Roda o mesmo que rodamos na maquina: tipos, lint, formatacao, testes e build.

name: Verificações

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  DATABASE_URL: file:./dev.db
  SEGREDO_SESSAO: segredo-somente-para-ci-nao-usar-em-producao
  ORIGIN: http://localhost:4100

jobs:
  qualidade:
    name: Tipos, lint e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Preparar o banco
        run: |
          npx prisma migrate deploy
          npm run banco:semear

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run formatar:checar

      - name: Testes unitários e de integração
        run: npm run teste:unitario

      - name: Build de produção
        run: npm run build

  ponta-a-ponta:
    name: Playwright (390px e 1440px)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar o Chromium
        run: npx playwright install --with-deps chromium

      - name: Preparar o banco
        run: |
          npx prisma migrate deploy
          npm run banco:semear

      - name: Testes ponta a ponta
        run: npm run teste:ponta

      - name: Guardar o relatório quando falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: playwright-report/
          retention-days: 7
